name: finstance-dev
services:
  ui:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    volumes:
      - ..:/workspace
      - ui_modules:/workspace/ui/finstance/node_modules
      - ui_next:/workspace/ui/finstance/.next
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      FINSTANCE_API_URL: http://api:5257
      WATCHPACK_POLLING: "true"
    depends_on:
      - api
  api:
    build:
      context: ../api
    ports:
      - "127.0.0.1:5257:5257"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Initialize: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: finstance_dev
      POSTGRES_USER: finstance
      POSTGRES_PASSWORD: finstance_local_dev
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: finstance_dev
      POSTGRES_USER: finstance
      POSTGRES_PASSWORD: finstance_local_dev
    volumes:
      - dev_database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finstance -d finstance_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  ui_modules:
  ui_next:
  dev_database:
