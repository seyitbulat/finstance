services:
  finstance-db:
    image: postgres:18
    container_name: finstance-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 96D5xSEpJyD88N7q5
      POSTGRES_DB: finstancedb
    ports:
      - "5432:5432"
    volumes:
      - finstance_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: finstance-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - finstance-db


volumes:
  finstance_data: